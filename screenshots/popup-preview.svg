  <rect x="10" y="284" width="328" height="76" rx="8" fill="#141414" stroke="#1e1e1e" stroke-width="1"/>
  <text x="22" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#444" letter-spacing="0.8">#CRACKED BAR</text>
