<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 548" width="360" height="548">
  <defs>
    <linearGradient id="g-aura" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8860b"/>
      <stop offset="50%"  stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="g-cracked" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <rect x="6" y="8" width="348" height="534" rx="13" fill="#000" opacity="0.5"/>

  <!-- Popup background -->
  <rect x="0" y="0" width="348" height="534" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- ─── HEADER ──────────────────────────────────────────────────────── -->
  <text x="22" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">🐙 GitHub Daily Tracker</text>
  <text x="22" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">@yigitmeteozcan</text>
  <rect x="308" y="20" width="28" height="28" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="322" y="39" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">↻</text>

  <!-- ─── TODAY'S COMMITS ─────────────────────────────────────────────── -->
  <rect x="10" y="66" width="328" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="22" y="82" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#8b949e" letter-spacing="0.7">TODAY'S COMMITS</text>
  <!-- track -->
  <rect x="22" y="89" width="220" height="8" rx="4" fill="#21262d"/>
  <!-- fill: 3/5 = 60% → 132 px -->
  <rect x="22" y="89" width="132" height="8" rx="4" fill="#f85149"/>
  <text x="252" y="97" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">3 / 5</text>
  <text x="22" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f0883e">🔥 12 day streak!</text>

  <!-- ─── STREAK ──────────────────────────────────────────────────────── -->
  <rect x="10" y="154" width="328" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="22" y="181" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">🔥 Streak: 12 days</text>
  <text x="270" y="181" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">Best: 15 days</text>

  <!-- ─── AURA ────────────────────────────────────────────────────────── -->
  <rect x="10" y="206" width="328" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="22" y="222" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#f0c040" letter-spacing="0.7">AURA</text>
  <!-- track -->
  <rect x="22" y="229" width="220" height="8" rx="4" fill="#21262d"/>
  <!-- fill: 1240/5000 = 24.8% → 55 px -->
  <rect x="22" y="229" width="55" height="8" rx="4" fill="url(#g-aura)"/>
  <text x="22" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#f0c040">1,240 ✨</text>

  <!-- ─── CRACKED BAR ─────────────────────────────────────────────────── -->
  <rect x="10" y="294" width="328" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="22" y="310" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#8b949e" letter-spacing="0.7">#CRACKED BAR</text>
  <!-- track -->
  <rect x="22" y="317" width="220" height="8" rx="4" fill="#21262d"/>
  <!-- fill: 18/30 = 60% → 132 px -->
  <rect x="22" y="317" width="132" height="8" rx="4" fill="url(#g-cracked)"/>
  <text x="22" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">Day 18 / 30</text>

  <!-- ─── RANK ────────────────────────────────────────────────────────── -->
  <rect x="10" y="382" width="328" height="108" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="174" y="415" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">📚 CS Undergrad</text>
  <text x="174" y="435" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#8b949e" font-style="italic" text-anchor="middle">pulling all nighters</text>
  <text x="174" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Next rank: <tspan fill="#58a6ff">🎓 Stanford Kid</tspan> → 2 more days</text>

  <!-- ─── FOOTER ─────────────────────────────────────────────────────── -->
  <text x="22" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#8b949e">⚙️ Settings</text>
  <text x="326" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#484f58" text-anchor="end">Updated 3m ago</text>
</svg>
