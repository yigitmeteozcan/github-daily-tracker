<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">

  <!-- Subtle page background hint -->
  <rect x="0" y="0" width="280" height="90" rx="6" fill="#0d1117"/>

  <!-- Drop shadow -->
  <rect x="26" y="14" width="234" height="68" rx="12" fill="#000" opacity="0.4"/>

  <!-- Widget card -->
  <rect x="22" y="10" width="234" height="68" rx="10" fill="#13181f" stroke="#21262d" stroke-width="1"/>

  <!-- ── Header row ─────────────────────────────── -->
  <!-- "TODAY" label -->
  <text x="34" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#444c56" letter-spacing="0.5">TODAY</text>
  <!-- "3 / 5" count -->
  <text x="72" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="-0.2">3 / 5</text>
  <!-- "60%" pct -->
  <text x="108" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#636e7b">60%</text>
  <!-- "5m" timestamp -->
  <text x="198" y="27" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#444c56">5m</text>
  <!-- close × -->
  <text x="224" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#444c56">×</text>

  <!-- ── Progress bar ────────────────────────────── -->
  <!-- track -->
  <rect x="34" y="35" width="210" height="4" rx="2" fill="#1c2128"/>
  <!-- fill: 60% = 126 px — blue (in progress) -->
  <rect x="34" y="35" width="126" height="4" rx="2" fill="#58a6ff"/>

  <!-- ── Stats row ──────────────────────────────── -->
  <text x="34" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">🔥 12d streak</text>
  <text x="113" y="57" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#30363d">·</text>
  <text x="121" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">📚 CS Undergrad</text>
  <text x="34" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">· ✨ 1.2k aura</text>

</svg>
