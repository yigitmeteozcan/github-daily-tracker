<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">

  <!-- Page background hint -->
  <rect x="0" y="0" width="280" height="90" rx="6" fill="#0c0c0c"/>

  <!-- Drop shadow -->
  <rect x="26" y="14" width="234" height="68" rx="12" fill="#000" opacity="0.4"/>

  <!-- Widget card -->
  <rect x="22" y="10" width="234" height="68" rx="10" fill="#141414" stroke="#1e1e1e" stroke-width="1"/>

  <!-- ── Header row ─────────────────────────── -->
  <text x="34" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#3a3a3a" letter-spacing="0.5">TODAY</text>
  <text x="72" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f0f0f0" letter-spacing="-0.2">3 / 5</text>
  <text x="108" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#555">60%</text>
  <text x="198" y="27" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#3a3a3a">5m</text>
  <text x="224" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#3a3a3a">×</text>

  <!-- ── Progress bar ────────────────────────── -->
  <rect x="34" y="35" width="210" height="3" rx="1.5" fill="#1e1e1e"/>
  <!-- 60% = 126px — gray (in progress) -->
  <rect x="34" y="35" width="126" height="3" rx="1.5" fill="#444"/>

  <!-- ── Stats row ──────────────────────────── -->
  <text x="34" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888">🔥 12d streak</text>
  <text x="113" y="55" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#2a2a2a">·</text>
  <text x="121" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888">📚 CS Undergrad</text>
  <text x="34" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888">· ✨ 1.2k</text>

</svg>
